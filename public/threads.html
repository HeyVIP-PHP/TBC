<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TG Reply Threads</title>
<link rel="stylesheet" href="/assets/style.css?v=e81e76e2" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=9cc20fef"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js"></script>
<script src="/assets/schemas.js?v=f6a765aa"></script>
<script src="/assets/toast.js?v=debe1ac1"></script>
</head>
<body class="threads-page">
  <!-- Attachment lightbox — populated live by viewAttachment() below.
       Fetches bytes on demand from /api/attachment/<fileId>, never a
       stored copy — see that endpoint's own comment for why. -->
  <div class="attach-lightbox" id="attachLightbox">
    <button type="button" class="attach-lightbox-close" id="attachLightboxClose" title="Close">✕</button>
    <div class="attach-lightbox-body" id="attachLightboxBody"></div>
  </div>
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">PHP CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
    </div>
  </header>

  <div id="announcementBanner"></div>
  <script src="/assets/announcement-banner.js?v=44227438" defer></script>

  <div class="threads-topline">
    <a href="/" class="back-pill">&larr; Back to Home</a>
  </div>

  <div class="threads-shell" id="threadsShell">
    <aside class="threads-sidebar">
      <div class="threads-search">
        <span>🔍</span>
        <input type="text" id="threadSearch" placeholder="Search username, TID, UID..." autocomplete="off" />
      </div>

      <div class="threads-select-toolbar" id="selectToolbar" style="display:none;"></div>

      <div class="threads-section" id="activeSection">
        <div class="threads-section-title" data-target="activeList"><span><input type="checkbox" class="section-select-all" id="activeSelectAll" title="Select all" /><span class="chev">▾</span> Active Threads</span><span class="count" id="activeCount">0</span></div>
        <div class="thread-list" id="activeList"></div>
      </div>

      <div class="threads-section collapsed" id="solvedSection">
        <div class="threads-section-title collapsed" data-target="solvedList"><span><input type="checkbox" class="section-select-all" id="solvedSelectAll" title="Select all" /><span class="chev">▾</span> Solved Chat History</span><span class="count" id="solvedCount">0</span></div>
        <div class="thread-list" id="solvedList"></div>
      </div>

      <div class="threads-section recall collapsed" id="recallSection" style="display:none;">
        <div class="threads-section-title collapsed" data-target="recallList"><span><span class="chev">▾</span> Recall Chat History</span><span class="count" id="recallCount">0</span></div>
        <div class="thread-list" id="recallList"></div>
      </div>
    </aside>

    <main class="threads-main" id="threadsMain">
      <div class="threads-placeholder">Pick a thread on the left, or submit a form to start one.</div>
    </main>
  </div>

  <script>
    window.initThemeToggle();

    window.initClock();

    // ---- Auth ----------------------------------------------------------
    // No session/token — see functions/_shared/accounts.js for why. We
    // just keep the username+password the agent logged in with in
    // localStorage and re-send them as headers on every request; the
    // server re-verifies (password + office IP) every single time.
    // Login itself, idle-timeout, and the actual auth headers are all
    // handled by /assets/authguard.js (window.AgentAuth) before this page
    // even renders — by the time this script runs, we're guaranteed to be
    // logged in. authFetch here is just a short alias.
    const authFetch = window.AgentAuth.authFetch;
    const getAuth = window.AgentAuth.getAuth;

    function bootDashboard() {
      const auth = getAuth();
      // Recall Chat History (the old hidden deletion-log dot) is a normal
      // section now, but still admin-or-above only — the server 401s it
      // for anyone else regardless, this just avoids showing a dead-end
      // section to an agent/senior who'd get nothing useful out of it.
      // Rank-based (not a literal "admin" string match) so SuperAdmin
      // sees it too — matches functions/_shared/accounts.js ROLE_RANK.
      const ROLE_RANK = { agent: 0, senior: 1, admin: 2, superadmin: 3, owner: 4 };
      const isAdmin = (ROLE_RANK[auth.role] ?? 0) >= ROLE_RANK.admin;
      document.getElementById("recallSection").style.display = isAdmin ? "" : "none";
      loadList();
      if (isAdmin) loadRecallLog();
      polishEmoji();
      // Two different rhythms on purpose: refreshOpenThread() reads a
      // single thread directly by ID (cheap, not affected by KV's
      // separate/stricter list() quota — see loadList() below), so it
      // stays fast/responsive since that's what actually matters when
      // someone's actively viewing a conversation. loadList() (the
      // sidebar) is what calls the server's listThreads(), which is
      // itself now cached for 3 minutes server-side — polling it every
      // 6s was just re-fetching the exact same cached data 30 times
      // over for no benefit, while still adding needless request volume.
      // 30s keeps the sidebar feeling reasonably live without that waste.
      pollTimer = setInterval(() => {
        refreshOpenThread();
      }, 6000);
      listPollTimer = setInterval(() => {
        loadList(document.getElementById("threadSearch").value);
        if (isAdmin) loadRecallLog();
      }, 30000);
    }

    // ---------------------------------------------------------------------

    let activeThreads = [];
    let solvedThreads = [];
    let recallEntries = [];
    let selectedId = null;
    let selectedThread = null;
    let pollTimer = null;
    let listPollTimer = null;
    let searchTimer = null;

    // ---- Local "optimistic" sidebar patches --------------------------
    // The sidebar list comes from THREADS_KV.list() (see threads.js),
    // which Cloudflare documents as *eventually* consistent across their
    // edge — writing a thread's new metadata (e.g. solved:true) doesn't
    // guarantee list() reflects it on the very next call. But any action
    // WE just took (solve/unsolve/delete/reply) already hands us that
    // thread's true fresh state straight from the POST response — no
    // reason to wait for list() to catch up just to show it. So: patch
    // it into the local sidebar arrays immediately, and keep protecting
    // that entry from being clobbered by a stale server response for a
    // short window, long enough for KV to actually propagate.
    const localPatches = new Map(); // id -> { summary: {...}|null, expiresAt }
    const PATCH_TTL_MS = 20000;

    function summaryFromThread(t) {
      return {
        id: t.id, module: t.module, moduleName: t.moduleName, icon: t.icon, accent: t.accent,
        brand: t.brand, title: t.title, submitter: t.submitter, submittedAt: t.submittedAt,
        lastActivity: t.lastActivity, solved: t.solved, solvedAt: t.solvedAt,
        replyCount: t.messages.length,
      };
    }

    // Call right after a solve/unsolve/reply/edit/recall action succeeds —
    // `t` is the fresh thread record the server just handed back.
    function patchLocalThread(t) {
      localPatches.set(t.id, { summary: summaryFromThread(t), expiresAt: Date.now() + PATCH_TTL_MS });
      applyLocalPatches();
      renderLists();
    }

    // Call right after a delete succeeds.
    function removeLocalThread(id) {
      localPatches.set(id, { summary: null, expiresAt: Date.now() + PATCH_TTL_MS });
      applyLocalPatches();
      renderLists();
    }

    // Re-applies every still-valid local patch on top of whatever
    // activeThreads/solvedThreads currently hold (freshly fetched from the
    // server, or just patched) — expired patches (KV has had plenty of
    // time to catch up by then) are dropped so the server becomes the
    // source of truth again.
    function applyLocalPatches() {
      const now = Date.now();
      for (const [id, patch] of Array.from(localPatches.entries())) {
        if (patch.expiresAt < now) { localPatches.delete(id); continue; }
        activeThreads = activeThreads.filter((t) => t.id !== id);
        solvedThreads = solvedThreads.filter((t) => t.id !== id);
        if (patch.summary) (patch.summary.solved ? solvedThreads : activeThreads).unshift(patch.summary);
      }
    }

    const activeList = document.getElementById("activeList");
    const solvedList = document.getElementById("solvedList");
    const activeCount = document.getElementById("activeCount");
    const solvedCount = document.getElementById("solvedCount");
    const main = document.getElementById("threadsMain");

    // ---- Diffed sidebar rendering ----------------------------------------
    // renderLists() used to do `list.innerHTML = ""` + rebuild every row from
    // scratch on every poll tick / select-mode toggle / menu open-close —
    // fine at a handful of threads, but it means every 30s poll (and every
    // click) tears down and rebuilds the *entire* sidebar DOM even when only
    // one thread actually changed, which gets janky once there are a few
    // hundred threads. renderedItemEls tracks one live DOM node per thread
    // id across BOTH lists (a thread moves from here to solvedList when it
    // gets solved, or back when reopened — same Map, so the move is just an
    // insertBefore into the other container, not a delete+recreate).
    const renderedItemEls = new Map(); // id -> { el, key }

    // Fingerprint of everything renderItem()'s output actually depends on.
    // If this string is unchanged since last render, the existing DOM node
    // is reused as-is (just repositioned if needed) instead of rebuilt.
    function itemRenderKey(t) {
      return [
        t.title, t.submitter, t.lastActivity, t.replyCount, t.solved,
        t.icon, t.accent, isUnread(t), getSeenCount(t.id),
        t.id === selectedId, selectedIds.has(t.id), selectMode,
        openMenuId === t.id,
      ].join("|");
    }

    // Reconciles one <div class="thread-list"> against the `items` array
    // that should be in it, right now, in that order.
    function reconcileSection(container, items) {
      let prevEl = null;
      items.forEach((item) => {
        const key = itemRenderKey(item);
        let entry = renderedItemEls.get(item.id);
        if (!entry || entry.key !== key) {
          // Content changed (or first time seeing this id) — build a fresh
          // node. Critical: detach the OLD node before swapping the Map's
          // pointer to the new one. Skipping this leaves the old node
          // physically in the DOM (it was insertBefore'd in on a previous
          // render) with nothing left that can ever find it again to
          // reposition or delete it — a permanent duplicate "ghost" row
          // that piles up once per update on whichever thread is busiest.
          if (entry) entry.el.remove();
          entry = { el: renderItem(item), key };
          renderedItemEls.set(item.id, entry);
        }
        // insertBefore on a node that's already exactly there is a no-op;
        // on a node currently in the OTHER list (cross-group move, e.g.
        // solved -> reopened) it detaches it from there first automatically
        // — never two copies live at once.
        const wantPos = prevEl ? prevEl.nextSibling : container.firstChild;
        if (entry.el.parentNode !== container || entry.el !== wantPos) {
          container.insertBefore(entry.el, wantPos);
        }
        prevEl = entry.el;
      });
    }

    document.querySelectorAll(".threads-section-title").forEach((el) => {
      el.addEventListener("click", (e) => {
        if (e.target.closest(".section-select-all")) return; // handled by its own listener below, not a collapse toggle
        el.classList.toggle("collapsed");
        document.getElementById(el.dataset.target).closest(".threads-section").classList.toggle("collapsed");
      });
    });
    document.getElementById("activeSelectAll").addEventListener("click", (e) => { e.stopPropagation(); toggleSectionSelectAll(activeThreads); });
    document.getElementById("solvedSelectAll").addEventListener("click", (e) => { e.stopPropagation(); toggleSectionSelectAll(solvedThreads); });

    const RECALL_TYPE_META = {
      "delete-thread": { icon: "🗑", badge: "Deleted" },
      "recall-root": { icon: "↩️", badge: "Recalled" },
      "recall-reply": { icon: "↩️", badge: "Recalled reply" },
    };

    // Admin-only — the whole #recallSection is display:none for non-admins
    // (set in bootDashboard), and the server 401s this endpoint for them
    // too, so this never actually runs for a non-admin account.
    async function loadRecallLog() {
      try {
        const res = await authFetch("/api/deletion-log", { cache: "no-store" });
        if (res.status === 401) return; // not admin (or logged out — authFetch already handled that)
        const data = await res.json();
        if (!data.ok) return;
        recallEntries = data.entries || [];
        renderRecallList();
      } catch {
        // Network hiccup — leave the list as-is, try again next poll.
      }
    }

    function renderRecallList() {
      document.getElementById("recallCount").textContent = recallEntries.length;
      const list = document.getElementById("recallList");
      if (!recallEntries.length) {
        list.innerHTML = '<div class="threads-empty">No deletions logged yet.</div>';
        return;
      }
      list.innerHTML = recallEntries.map((e) => {
        const meta = RECALL_TYPE_META[e.type] || { icon: "🗑", badge: e.type };
        return `
          <div class="thread-item recall-item">
            <div class="icon">${meta.icon}</div>
            <div class="meta">
              <div class="t-title"><span class="badge">${escapeHtml(meta.badge)}</span>${escapeHtml(e.threadTitle || "")}</div>
              <div class="t-sub">${escapeHtml(e.by || "unknown")} · ${timeAgo(e.ts)}${e.brand ? " · " + escapeHtml(e.brand) : ""}</div>
              <div class="t-content">${escapeHtml((e.content || "").slice(0, 120))}</div>
            </div>
          </div>`;
      }).join("");
      polishEmoji();
    }

    document.getElementById("threadSearch").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      const q = e.target.value;
      searchTimer = setTimeout(() => loadList(q), 250);
    });

    let pendingAttachments = []; // File[] — queued for the next reply, up to MAX_REPLY_ATTACHMENTS
    const MAX_REPLY_ATTACHMENTS = 10; // Telegram's own sendMediaGroup album cap
    const MAX_ATTACHMENT_MB = 45; // stays under Telegram Bot API's ~50MB upload ceiling with some margin
    let replyTarget = null; // { messageId, from, text } | null

    function setReplyTarget(messageId, from, text) {
      replyTarget = { messageId: Number(messageId), from, text };
      renderReplyTargetBanner();
      document.getElementById("replyInput")?.focus();
    }
    function clearReplyTarget() {
      replyTarget = null;
      renderReplyTargetBanner();
    }
    function renderReplyTargetBanner() {
      const el = document.getElementById("replyTargetBanner");
      if (!el) return;
      if (!replyTarget) { el.innerHTML = ""; return; }
      el.innerHTML = `
        <span class="reply-target-chip">
          ↳ Replying to <b>${escapeHtml(replyTarget.from)}</b>: ${escapeHtml((replyTarget.text || "").slice(0, 60))}
          <button type="button" id="cancelReplyTarget">✕</button>
        </span>`;
      document.getElementById("cancelReplyTarget").addEventListener("click", clearReplyTarget);
      polishEmoji();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---- @ Tag Username ------------------------------------------------
    // Telegram's Bot API has no "list group members" call (platform
    // limitation, not something fixable here) — so this can only ever
    // suggest people who've actually replied in this ticket's brand+module
    // group/topic before. See rememberMentionCandidate() in
    // functions/_shared/threads.js for the full writeup, and
    // functions/api/admin/mention-backfill.js for the historical-data
    // half of it.
    //
    // Cached per brandId+module in memory (a Promise, not just the
    // resolved value, so two @ keystrokes in quick succession on the same
    // ticket share one in-flight request instead of firing two) — a
    // fresh page load starts empty, which is fine, this is just an
    // autocomplete convenience, not a source of truth for anything.
    const mentionCandidatesCache = new Map(); // "brandId|module" -> Promise<[{handle,from,lastSeen}]>
    let mentionState = { candidates: [], open: false, filtered: [], activeIndex: 0, fragmentStart: -1 };

    async function loadMentionCandidatesForThread(t) {
      mentionState.candidates = []; // clear immediately — don't show the PREVIOUS thread's people while this one loads
      if (!t.brandId || !t.module) return; // pre-"Sync to Sheet" tickets have no brandId — nothing to scope candidates to
      const key = `${t.brandId}|${t.module}`;
      if (!mentionCandidatesCache.has(key)) {
        mentionCandidatesCache.set(key, (async () => {
          try {
            const res = await authFetch(`/api/mention-candidates?brandId=${encodeURIComponent(t.brandId)}&module=${encodeURIComponent(t.module)}`);
            const data = await res.json();
            return data.ok ? data.candidates : [];
          } catch {
            return [];
          }
        })());
      }
      const base = await mentionCandidatesCache.get(key);
      if (!selectedThread || selectedThread.id !== t.id) return; // agent switched tickets while this was in flight — stale, drop it
      // Merge in THIS ticket's own conversation participants too — covers
      // the gap between a reply landing (webhook writes it instantly) and
      // the registry write becoming visible via this cached fetch (KV
      // eventual consistency, or simply an in-flight request that started
      // before the newest reply's registry write finished).
      const merged = new Map(base.map((c) => [c.handle, c]));
      (t.messages || []).forEach((m) => {
        if (!m.self && m.handle && !merged.has(m.handle)) {
          merged.set(m.handle, { handle: m.handle, from: m.from || null, lastSeen: (m.ts || "").slice(0, 10) });
        }
      });
      mentionState.candidates = Array.from(merged.values());
    }

    function wireMentionAutocomplete() {
      const input = document.getElementById("replyInput");
      if (!input) return;
      input.addEventListener("input", () => {
        const val = input.value;
        const caret = input.selectionStart;
        const match = val.slice(0, caret).match(/(?:^|\s)@(\w*)$/);
        if (!match) { closeMentionDropdown(); return; }
        const fragment = match[1];
        mentionState.fragmentStart = caret - fragment.length - 1; // index of the '@' itself
        const needle = fragment.toLowerCase();
        mentionState.filtered = mentionState.candidates.filter((c) => c.handle.slice(1).toLowerCase().startsWith(needle));
        if (!mentionState.filtered.length) { closeMentionDropdown(); return; }
        mentionState.activeIndex = 0;
        mentionState.open = true;
        renderMentionDropdown();
      });
      // Registered here (before renderDetail's own Enter=send listener)
      // specifically so Enter/Tab/Escape get swallowed via
      // stopImmediatePropagation() while the dropdown is open, instead of
      // ALSO triggering sendReply() or leaving the fragment text in place.
      input.addEventListener("keydown", (e) => {
        if (!mentionState.open) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          mentionState.activeIndex = (mentionState.activeIndex + 1) % mentionState.filtered.length;
          renderMentionDropdown();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          mentionState.activeIndex = (mentionState.activeIndex - 1 + mentionState.filtered.length) % mentionState.filtered.length;
          renderMentionDropdown();
        } else if (e.key === "Enter" || e.key === "Tab") {
          e.preventDefault();
          e.stopImmediatePropagation();
          pickMention(mentionState.filtered[mentionState.activeIndex]);
        } else if (e.key === "Escape") {
          closeMentionDropdown();
        }
      });
      input.addEventListener("blur", () => {
        // Slight delay: a mousedown on a dropdown option fires before
        // this blur, but if we close synchronously here first, the
        // option's own mousedown handler never gets to run.
        setTimeout(closeMentionDropdown, 150);
      });
    }

    function closeMentionDropdown() {
      mentionState.open = false;
      const dd = document.getElementById("mentionDropdown");
      if (dd) dd.style.display = "none";
    }

    function renderMentionDropdown() {
      const dd = document.getElementById("mentionDropdown");
      if (!dd) return;
      dd.style.display = "block";
      dd.innerHTML = mentionState.filtered.map((c, i) => `
        <div class="mention-option${i === mentionState.activeIndex ? " active" : ""}" data-idx="${i}">
          <span class="mention-handle">${escapeHtml(c.handle)}</span>
          ${c.from ? `<span class="mention-name">${escapeHtml(c.from)}</span>` : ""}
        </div>`).join("");
      dd.querySelectorAll(".mention-option").forEach((opt) => {
        // mousedown (not click) + preventDefault — keeps focus in the
        // input across the click, so the blur-close timer above never
        // even fires for this interaction.
        opt.addEventListener("mousedown", (e) => {
          e.preventDefault();
          pickMention(mentionState.filtered[Number(opt.dataset.idx)]);
        });
      });
    }

    function pickMention(candidate) {
      if (!candidate) return;
      const input = document.getElementById("replyInput");
      const val = input.value;
      const caret = input.selectionStart;
      const before = val.slice(0, mentionState.fragmentStart);
      const after = val.slice(caret);
      const insert = `${candidate.handle} `;
      input.value = before + insert + after;
      const newCaret = before.length + insert.length;
      input.setSelectionRange(newCaret, newCaret);
      closeMentionDropdown();
      input.focus();
    }

    function renderAttachPreview() {
      const el = document.getElementById("replyAttachPreview");
      if (!el) return;
      if (!pendingAttachments.length) { el.innerHTML = ""; return; }
      el.innerHTML = pendingAttachments
        .map((f, i) => `
          <span class="attach-chip">📎 ${escapeHtml(f.name)} (${Math.round(f.size / 1024)} KB)
            <button type="button" data-remove-attach="${i}">✕</button>
          </span>`)
        .join("");
      el.querySelectorAll("[data-remove-attach]").forEach((btn) => {
        btn.addEventListener("click", () => {
          pendingAttachments.splice(Number(btn.dataset.removeAttach), 1);
          renderAttachPreview();
        });
      });
      polishEmoji();
    }

    // Shared by the file picker (change event) and clipboard paste — both
    // just hand this a list of File objects and it applies the same
    // rules: drop anything over MAX_ATTACHMENT_MB (with a heads-up, since
    // a silent drop would look like a bug), cap the total queued at
    // MAX_REPLY_ATTACHMENTS, then re-render the chip row.
    function queueAttachments(files) {
      if (!files.length) return;
      const tooBig = files.filter((f) => f.size > MAX_ATTACHMENT_MB * 1024 * 1024);
      const sized = files.filter((f) => f.size <= MAX_ATTACHMENT_MB * 1024 * 1024);
      if (tooBig.length) alert(`${tooBig.map((f) => f.name).join(", ")} — over ${MAX_ATTACHMENT_MB}MB, Telegram will reject it. Not added.`);
      const room = MAX_REPLY_ATTACHMENTS - pendingAttachments.length;
      if (sized.length > room) alert(`You can attach up to ${MAX_REPLY_ATTACHMENTS} files in one message — only the first ${Math.max(room, 0)} of your new selection were added.`);
      pendingAttachments.push(...sized.slice(0, Math.max(room, 0)));
      renderAttachPreview();
    }

    function timeAgo(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    // Unread tracking — per-browser (each agent's "have I seen this" state
    // is naturally their own, not shared team-wide, same as Telegram's own
    // unread counts). Stored as "how many messages had I seen last time".
    function getSeenCount(id) {
      return parseInt(localStorage.getItem(`lastseen:${id}`) || "0", 10);
    }
    function markSeen(id, count) {
      localStorage.setItem(`lastseen:${id}`, String(count));
    }

    // ---- ⋮ menu + Select batch mode ------------------------------------
    let selectMode = false;
    let selectedIds = new Set();
    let openMenuId = null; // which single item's ⋮ menu is currently open (only ever one at a time)

    function selectedThreadObjs() {
      const all = [...activeThreads, ...solvedThreads];
      return all.filter((t) => selectedIds.has(t.id));
    }
    function isUnread(t) {
      return Math.max(0, (t.replyCount || 0) - getSeenCount(t.id)) > 0;
    }

    function enterSelectMode(initialId) {
      selectMode = true;
      selectedIds = new Set(initialId ? [initialId] : []);
      openMenuId = null;
      renderLists();
    }
    function exitSelectMode() {
      selectMode = false;
      selectedIds = new Set();
      renderLists();
    }
    function toggleItemSelected(id) {
      if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      renderLists();
    }
    function toggleSectionSelectAll(list) {
      if (!selectMode) selectMode = true;
      const allSelected = list.length > 0 && list.every((t) => selectedIds.has(t.id));
      list.forEach((t) => (allSelected ? selectedIds.delete(t.id) : selectedIds.add(t.id)));
      renderLists();
    }

    async function setThreadSolved(id, solved) {
      const res = await authFetch(`/api/threads/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: solved ? "solve" : "unsolve" }),
      });
      const data = await res.json();
      if (data.ok) {
        patchLocalThread(data.thread);
        if (selectedThread && selectedThread.id === id) {
          selectedThread = data.thread;
          updateThreadContent(selectedThread, true);
        }
      }
      return data.ok;
    }

    async function batchSetSolved(solved) {
      await Promise.all([...selectedIds].map((id) => setThreadSolved(id, solved)));
      exitSelectMode();
      loadList(document.getElementById("threadSearch").value);
    }
    function batchMarkRead(read) {
      selectedThreadObjs().forEach((t) => markSeen(t.id, read ? (t.replyCount || 0) : 0));
      exitSelectMode();
    }

    function renderSelectToolbar() {
      const bar = document.getElementById("selectToolbar");
      if (!selectMode) { bar.style.display = "none"; bar.innerHTML = ""; return; }
      bar.style.display = "";
      const n = selectedIds.size;
      const anyUnread = selectedThreadObjs().some(isUnread);
      const anyUnsolved = selectedThreadObjs().some((t) => !t.solved);
      const readLabel = anyUnread ? "Mark as read" : "Mark as unread";
      const solvedLabel = anyUnsolved ? "Solved" : "Not solved";
      bar.innerHTML = `
        <div class="select-toolbar-row1">
          <span class="select-count-badge">${n}</span>
          <button type="button" class="select-cancel-btn" id="selectCancelBtn">Cancel</button>
        </div>
        <div class="select-toolbar-row2">
          <button type="button" class="select-action-btn" id="selectReadBtn" ${n ? "" : "disabled"}>${readLabel}</button>
          <button type="button" class="select-action-btn ${anyUnsolved ? "tone-solve" : "tone-unsolve"}" id="selectSolvedBtn" ${n ? "" : "disabled"}>${solvedLabel}</button>
        </div>`;
      document.getElementById("selectCancelBtn").addEventListener("click", exitSelectMode);
      document.getElementById("selectReadBtn").addEventListener("click", () => batchMarkRead(anyUnread));
      document.getElementById("selectSolvedBtn").addEventListener("click", () => batchSetSolved(anyUnsolved));
    }

    function buildItemMenuHTML(t, unread) {
      return `
        <div class="thread-item-menu">
          <div class="thread-item-menu-option" data-act="select">☐ Select</div>
          ${unread
            ? '<div class="thread-item-menu-option" data-act="read">✓ Mark as read</div>'
            : '<div class="thread-item-menu-option" data-act="unread">○ Mark as unread</div>'}
          ${t.solved
            ? '<div class="thread-item-menu-option" data-act="unsolve">✕ Not solved</div>'
            : '<div class="thread-item-menu-option" data-act="solve">✅ Solved</div>'}
        </div>`;
    }

    function wireItemMenu(el, t) {
      el.querySelectorAll(".thread-item-menu-option").forEach((opt) => {
        opt.addEventListener("click", async (e) => {
          e.stopPropagation();
          const act = opt.dataset.act;
          openMenuId = null;
          if (act === "select") {
            enterSelectMode(t.id);
          } else if (act === "read") {
            markSeen(t.id, t.replyCount || 0);
            renderLists();
          } else if (act === "unread") {
            markSeen(t.id, 0);
            renderLists();
          } else if (act === "solve" || act === "unsolve") {
            renderLists(); // close the menu immediately, don't wait on the network
            await setThreadSolved(t.id, act === "solve");
            loadList(document.getElementById("threadSearch").value);
          }
        });
      });
    }

    function renderItem(t) {
      const el = document.createElement("div");
      el.className = "thread-item" + (t.id === selectedId ? " selected" : "") + (selectMode ? " select-mode-item" : "");
      el.style.setProperty("--thread-accent", t.accent || "#7c6cf0");
      const unread = isUnread(t);
      const checked = selectedIds.has(t.id);
      el.innerHTML = `
        ${selectMode ? `<input type="checkbox" class="thread-item-check" ${checked ? "checked" : ""} tabindex="-1" />` : ""}
        <div class="icon" style="background:${(t.accent || "#7c6cf0")}33;">${t.icon || "🔔"}</div>
        <div class="meta">
          <div class="t-title">${escapeHtml(t.title)}</div>
          <div class="t-sub">${escapeHtml(t.submitter)} · ${timeAgo(t.lastActivity)}${t.replyCount ? " · " + t.replyCount + " reply" : ""}</div>
        </div>
        ${unread ? `<span class="unread-badge">${(t.replyCount - getSeenCount(t.id)) > 99 ? "99+" : t.replyCount - getSeenCount(t.id)}</span>` : ""}
        ${t.solved ? '<span class="t-done">✓</span>' : ""}
        ${!selectMode ? `
          <div class="thread-item-menu-wrap">
            <button type="button" class="thread-item-menu-btn" title="More">⋮</button>
            ${openMenuId === t.id ? buildItemMenuHTML(t, unread) : ""}
          </div>` : ""}
      `;
      if (selectMode) {
        el.addEventListener("click", () => toggleItemSelected(t.id));
      } else {
        el.addEventListener("click", (e) => {
          if (e.target.closest(".thread-item-menu-wrap")) return; // menu button/options handle their own clicks
          if (t.id !== selectedId) { pendingAttachments = []; replyTarget = null; }
          openThread(t.id);
        });
        const menuBtn = el.querySelector(".thread-item-menu-btn");
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openMenuId = openMenuId === t.id ? null : t.id;
          renderLists();
        });
        if (openMenuId === t.id) wireItemMenu(el, t);
      }
      return el;
    }

    // Any click outside an open ⋮ menu closes it — the menu button itself
    // calls stopPropagation() on its own click, so this only ever fires
    // for genuine "clicked elsewhere" cases.
    document.addEventListener("click", () => {
      if (openMenuId !== null) { openMenuId = null; renderLists(); }
    });

    function polishEmoji() {
      if (window.twemoji) window.twemoji.parse(document.body, { folder: "svg", ext: ".svg" });
    }

    function renderLists() {
      activeCount.textContent = activeThreads.length;
      solvedCount.textContent = solvedThreads.length;

      if (!activeThreads.length) {
        // Genuinely empty — nothing to diff against, just show the
        // placeholder. (Any previously-tracked nodes get swept up by the
        // orphan cleanup pass below since their ids won't be in liveIds.)
        activeList.innerHTML = '<div class="threads-empty">No active threads.<br/>Submit a form to start one.</div>';
      } else {
        const emptyEl = activeList.querySelector(".threads-empty");
        if (emptyEl) emptyEl.remove();
        reconcileSection(activeList, activeThreads);
      }
      reconcileSection(solvedList, solvedThreads);

      // Sweep any tracked id that's no longer in either list (thread got
      // deleted, or fell out of both arrays some other way) — without this,
      // reconcileSection alone has no reason to ever visit a removed id
      // again, so its node would just sit there forever.
      const liveIds = new Set([...activeThreads.map((t) => t.id), ...solvedThreads.map((t) => t.id)]);
      renderedItemEls.forEach((entry, id) => {
        if (!liveIds.has(id)) {
          entry.el.remove();
          renderedItemEls.delete(id);
        }
      });

      document.getElementById("activeSelectAll").style.display = selectMode ? "inline-block" : "none";
      document.getElementById("solvedSelectAll").style.display = selectMode ? "inline-block" : "none";
      document.getElementById("activeSelectAll").checked = activeThreads.length > 0 && activeThreads.every((t) => selectedIds.has(t.id));
      document.getElementById("solvedSelectAll").checked = solvedThreads.length > 0 && solvedThreads.every((t) => selectedIds.has(t.id));
      renderSelectToolbar();
      polishEmoji();
    }

    async function loadList(q) {
      try {
        const res = await authFetch(`/api/threads${q ? "?q=" + encodeURIComponent(q) : ""}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) return;
        activeThreads = data.active || [];
        solvedThreads = data.solved || [];
        applyLocalPatches();
        renderLists();
      } catch {
        // Network hiccup — keep showing the last known list, try again next poll.
      }
    }

    async function openThread(id) {
      selectedId = id;
      renderLists();
      try {
        const res = await authFetch(`/api/threads/${id}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          main.innerHTML = `<div class="threads-placeholder">Couldn't load this thread.</div>`;
          return;
        }
        selectedThread = data.thread;
        renderDetail();
        markSeen(id, selectedThread.messages.length);
        renderLists();
      } catch {
        main.innerHTML = `<div class="threads-placeholder">Couldn't load this thread — check your connection.</div>`;
      }
    }

    // Called by the poll (and only the poll) — fetches fresh data for the
    // open thread but updates it in place via updateThreadContent, so a
    // reply the agent is mid-typing is never interrupted.
    async function refreshOpenThread() {
      if (!selectedId) return;
      try {
        const res = await authFetch(`/api/threads/${selectedId}`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) return;
        selectedThread = data.thread;
        updateThreadContent(selectedThread);
        markSeen(selectedId, selectedThread.messages.length);
        renderLists();
      } catch {
        // Network hiccup — leave the panel as-is, try again next poll.
      }
    }

    function buildHeaderHTML(t) {
      return `
        <div class="thread-detail-header">
          <div>
            <div class="thread-detail-title"><span>${t.icon || "🔔"}</span> ${escapeHtml(t.title)}</div>
            <div class="thread-detail-sub">👤 ${escapeHtml(t.submitter)} &nbsp;·&nbsp; 📅 ${timeAgo(t.submittedAt)} &nbsp;·&nbsp; ${escapeHtml(t.brand)}</div>
          </div>
          <div class="thread-detail-actions">
            <button class="status-chip ${t.solved ? "solved" : "unsolved"}" id="solveBtn">${t.solved ? "✅ Solved" : "❌ Not Solved"}</button>
            ${!t.rootRecalled && (!t.fieldMap || !t.brandId) ? '<button class="icon-btn icon-btn-labeled" id="editRootBtn" title="Edit the original Telegram message (plain text — this ticket predates field-level editing)">✏️ Edit</button>' : ""}
            ${!t.rootRecalled && t.fieldMap && t.brandId ? '<button class="icon-btn icon-btn-labeled" id="editDetailsBtn" title="Edit fields — syncs the Telegram message + the Sheet row (if any)">✏️ Edit</button>' : ""}
            ${t.fieldMap && t.brandId ? '<button class="icon-btn icon-btn-labeled" id="forwardBtn" title="Generate a new ticket in another Topic, pre-filled from this one">↗️ Forward</button>' : ""}
            ${!t.rootRecalled ? '<button class="icon-btn icon-btn-labeled" id="recallRootBtn" title="Recall (delete) the original Telegram message">↩️ Recall</button>' : ""}
            <button class="icon-btn icon-btn-labeled" id="deleteBtn" title="Delete this tracking record (Telegram + Sheet are untouched)">🗑 Delete</button>
            <button class="icon-btn icon-btn-labeled" id="refreshBtn" title="Refresh this thread"><span class="icon-spin-target">🔄</span> Refresh</button>
          </div>
        </div>
        <hr class="thread-divider" />
      `;
    }

    // Everything that USED to be fixed at the top along with the header
    // (rootRecalled notice, the summary/attachments card) now scrolls
    // together with the conversation instead — only the header itself
    // (icon/title/Solved/✏️↩️🗑🔄) stays pinned. See renderDetail() and
    // updateThreadContent(), which prepend this to the scroll area's
    // innerHTML rather than the fixed one.
    function buildSummaryHTML(t) {
      return `
        ${t.rootRecalled ? `
          <div class="edit-modal-note err" style="font-size:12.5px; margin-bottom:14px;">
            ⚠️ The original message was recalled from Telegram — this ticket no longer exists in the group.
          </div>` : ""}

        ${(() => {
          // Clickable "View attachment" buttons for the ORIGINAL ticket's
          // own photo(s)/document(s) — reuses the exact same lightbox
          // (viewAttachment(), see the script below) and the same
          // /api/attachment/<fileId> live-proxy endpoint that reply
          // attachments use. Only present for tickets submitted after
          // this feature shipped — attachmentFileIds is simply empty/
          // undefined for older ones, so this cleanly renders nothing
          // rather than a broken button.
          const fileIds = t.attachmentFileIds || [];
          const fileNames = t.attachmentNames || []; // parallel to fileIds — see attachmentNames comment in _shared/threads.js
          const attachmentButtons = fileIds.length ? `
            <div class="thread-summary-attachments">
              ${fileIds.map((fid, i) => {
                const name = fileNames[i] || `ticket-attachment-${i + 1}`;
                return `
                <div class="inline-attach-slot" data-attachment-file="${escapeAttr(fid)}" data-attachment-name="${escapeAttr(name)}">
                  <div class="inline-attach-loading">Loading attachment…</div>
                </div>
              `;
              }).join("")}
            </div>` : "";

          if (t.rootEdited) {
            return `
              <div class="thread-summary-card">
                <div class="row" style="margin-bottom:6px;"><b style="color:var(--accent-gold);">✏️ Edited — current message text:</b></div>
                <div style="white-space:pre-wrap; font-size:13px;">${escapeHtml(stripHtmlTags(t.rootText || ""))}</div>
                ${attachmentButtons}
              </div>`;
          }
          // The exact text originally sent to Telegram — same emoji,
          // same line breaks, same wording an agent would see in the
          // Telegram group itself (just with the <b> HTML tags stripped,
          // since this renders as plain text, not HTML). Falls back to
          // the old simplified field-list (t.summary) only in the
          // unlikely case rootText itself is empty for some reason.
          if (t.rootText) {
            return `
              <div class="thread-summary-card">
                <div style="white-space:pre-wrap; font-size:13px; line-height:1.6;">${escapeHtml(stripHtmlTags(t.rootText))}</div>
                ${attachmentButtons}
              </div>`;
          }
          if (t.summary && t.summary.length) {
            return `
              <div class="thread-summary-card">
                ${t.summary.map((s) => `<div class="row"><b>${escapeHtml(s.label)}:</b> <span>${escapeHtml(s.value)}</span></div>`).join("")}
                ${attachmentButtons}
              </div>`;
          }
          return "";
        })()}

        ${t.forwardedFrom ? `
          <div class="forward-link-card" data-goto-thread="${escapeAttr(t.forwardedFrom.threadId)}">
            ↩️ Forwarded from <b>${escapeHtml(t.forwardedFrom.moduleName)}</b> — ${escapeHtml(t.forwardedFrom.title)}
          </div>` : ""}
        ${(t.forwardedTo || []).map((link) => `
          <div class="forward-link-card" data-goto-thread="${escapeAttr(link.threadId)}">
            ↗️ Forwarded to <b>${escapeHtml(link.moduleName)}</b> — ${escapeHtml(link.title)} &nbsp;<span class="forward-link-time">${timeAgo(link.at)}</span>
          </div>`).join("")}
      `;
    }

    function stripHtmlTags(str) {
      return String(str).replace(/<[^>]*>/g, "");
    }

    function buildConversationHTML(t) {
      const msgById = {};
      if (t.rootMessageId) {
        msgById[t.rootMessageId] = { from: "Original ticket", text: stripHtmlTags(t.rootText || t.title || "") };
      }
      t.messages.forEach((m) => {
        if (m.messageId) msgById[m.messageId] = { from: m.from, text: m.text };
      });
      return `
        <div class="conversation-title">Conversation (${t.messages.length})</div>
        <div class="conversation">
          ${t.messages.length ? t.messages.map((m) => renderMsg(m, msgById)).join("") : '<div class="threads-empty">No replies yet — they\'ll show up here as soon as someone replies in Telegram.</div>'}
        </div>
      `;
    }

    function wireTopButtons() {
      document.getElementById("solveBtn")?.addEventListener("click", () => toggleSolved());
      document.getElementById("deleteBtn")?.addEventListener("click", () => deleteThread());
      document.getElementById("editRootBtn")?.addEventListener("click", () => editRoot());
      document.getElementById("editDetailsBtn")?.addEventListener("click", () => openEditDetailsModal());
      document.getElementById("forwardBtn")?.addEventListener("click", () => openForwardModal());
      document.getElementById("recallRootBtn")?.addEventListener("click", () => recallRoot());
      document.getElementById("refreshBtn")?.addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.classList.add("spinning");
        btn.disabled = true;
        const startedAt = Date.now();
        const MIN_VISIBLE_MS = 2000;
        try {
          await loadList(document.getElementById("threadSearch").value);
          await refreshOpenThread();
        } finally {
          const elapsed = Date.now() - startedAt;
          if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
          document.getElementById("refreshBtn")?.classList.remove("spinning");
          if (document.getElementById("refreshBtn")) document.getElementById("refreshBtn").disabled = false;
        }
      });
    }

    function wireConversationButtons() {
      document.querySelectorAll("[data-edit-reply]").forEach((btn) => {
        btn.addEventListener("click", () => editReply(btn.dataset.editReply, btn.dataset.currentText));
      });
      document.querySelectorAll("[data-recall-reply]").forEach((btn) => {
        btn.addEventListener("click", () => recallReply(btn.dataset.recallReply));
      });
      document.querySelectorAll("[data-reply-target]").forEach((btn) => {
        btn.addEventListener("click", () => setReplyTarget(btn.dataset.replyTarget, btn.dataset.replyFrom, btn.dataset.replyText));
      });
      document.querySelectorAll("[data-goto-thread]").forEach((card) => {
        card.addEventListener("click", () => openThread(card.dataset.gotoThread));
      });
    }

    function isNearBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    }

    function scrollConversation(force) {
      const area = document.getElementById("threadScrollArea");
      if (!area) return;
      if (force || isNearBottom(area)) area.scrollTop = area.scrollHeight;
    }

    // Full render — used when opening/switching threads. Builds the reply
    // box fresh (it's fine to lose focus here since the panel just opened).
    function renderDetail() {
      const t = selectedThread;
      if (!t) return;
      main.innerHTML = `
        <div class="thread-top-fixed" id="threadTopFixed">${buildHeaderHTML(t)}</div>
        <div class="thread-scroll-area" id="threadScrollArea">${buildSummaryHTML(t)}${buildConversationHTML(t)}</div>
        <div class="thread-reply-fixed">
          <div id="replyTargetBanner"></div>
          <div class="reply-attach-preview" id="replyAttachPreview"></div>
          <div class="reply-box">
            <div class="reply-input-wrap">
              <button class="attach-btn" id="attachBtn" title="Attach images, videos, or PDFs (multiple allowed, or paste an image directly into the box)">🔗</button>
              <input type="file" id="replyFileInput" accept="image/*,video/*,application/pdf" multiple hidden />
              <input type="text" id="replyInput" placeholder="Write a message..." autocomplete="off" />
              <div class="mention-dropdown" id="mentionDropdown" style="display:none;"></div>
            </div>
            <button id="replySend">Send</button>
          </div>
        </div>
      `;
      wireTopButtons();
      wireConversationButtons();
      document.getElementById("replySend").addEventListener("click", sendReply);
      wireMentionAutocomplete(); // MUST be wired before the Enter=send listener below, so it can swallow Enter first while the @ dropdown is open
      document.getElementById("replyInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendReply();
      });
      document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("replyFileInput").click());
      document.getElementById("replyFileInput").addEventListener("change", (e) => {
        // Accumulate across multiple picks (the attach button can be
        // clicked again to add more) rather than replacing the queue.
        queueAttachments(Array.from(e.target.files || []));
        e.target.value = ""; // reset so picking the same file again still fires "change"
      });
      renderAttachPreview();
      scrollConversation(true);
      polishEmoji();
      loadInlineAttachments();
      loadMentionCandidatesForThread(t);
    }

    // Light refresh — used by polling and after in-place actions (solve,
    // send, edit, recall). Only touches the top info block and the
    // conversation; the reply box (and whatever the agent is mid-typing)
    // is never rebuilt, so focus/cursor/draft text all survive.
    function updateThreadContent(t, forceScroll) {
      const topFixed = document.getElementById("threadTopFixed");
      const scrollArea = document.getElementById("threadScrollArea");
      if (!topFixed || !scrollArea) { renderDetail(); return; }
      const wasNearBottom = isNearBottom(scrollArea);
      topFixed.innerHTML = buildHeaderHTML(t);
      wireTopButtons();
      scrollArea.innerHTML = buildSummaryHTML(t) + buildConversationHTML(t);
      wireConversationButtons();
      if (forceScroll || wasNearBottom) scrollConversation(true);
      polishEmoji();
      loadInlineAttachments();
    }

    const AVATAR_COLORS = ["#60A5FA", "#FBBF24", "#F87171", "#F472B6", "#34D399", "#A78BFA", "#38bdf8", "#fb923c"];
    function colorFor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }

    function renderMsg(m, msgById) {
      const selfControls = m.self && m.messageId ? `
        <span class="msg-actions">
          <button data-edit-reply="${m.messageId}" data-current-text="${escapeAttr(m.text)}" title="Edit">✏️</button>
          <button data-recall-reply="${m.messageId}" title="Recall">↩️</button>
        </span>` : "";
      const replyTargetBtn = m.messageId
        ? `<button class="reply-target-btn" data-reply-target="${m.messageId}" data-reply-from="${escapeAttr(m.from)}" data-reply-text="${escapeAttr(m.text)}" title="Reply to this message">↳</button>`
        : "";
      const quoted = m.replyToMessageId && msgById && msgById[m.replyToMessageId];
      const replyQuote = quoted
        ? `<div class="reply-quote-preview"><b>${escapeHtml(quoted.from)}</b>${escapeHtml((quoted.text || "").slice(0, 80))}</div>`
        : "";
      const initials = (m.from || "?").trim().slice(0, 2).toUpperCase();
      const color = m.self ? "var(--accent-gold)" : colorFor(m.from || "?");
      const deliveredTick = m.self ? '<span class="msg-tick" title="Delivered">✓</span>' : "";
      // attachmentFileIds/attachmentNames (plural, arrays) is the current
      // shape for a reply's attachments — falls back to the old singular
      // attachmentFileId/attachmentName fields for replies sent before
      // multi-attachment support existed, so old threads still render.
      const attachFileIds = (m.attachmentFileIds && m.attachmentFileIds.length) ? m.attachmentFileIds : (m.attachmentFileId ? [m.attachmentFileId] : []);
      const attachNames = (m.attachmentNames && m.attachmentNames.length) ? m.attachmentNames : (m.attachmentName ? [m.attachmentName] : []);
      const attachTag = m.hasAttachment
        ? (attachFileIds.length
            ? attachFileIds.map((fid, i) => `<div class="inline-attach-slot msg-inline-attach" data-attachment-file="${escapeAttr(fid)}" data-attachment-name="${escapeAttr(attachNames[i] || "attachment")}"><div class="inline-attach-loading">Loading attachment…</div></div>`).join("")
            : '<span class="msg-attach-tag" title="Sent before this dashboard could look attachments back up — check the Telegram group for it.">📎 attachment</span>')
        : "";
      return `
        <div class="msg-row ${m.self ? "self" : ""}">
          <div class="msg-avatar" style="background:${color};">${initials}</div>
          <div class="msg-body">
            <div class="msg-who">${escapeHtml(m.from)}${m.handle ? ` <span class="msg-handle">${escapeHtml(m.handle)}</span>` : ""}${m.editedAt ? ' <span class="msg-edited">(edited)</span>' : ""}</div>
            <div class="msg-bubble">${replyTargetBtn}${replyQuote}${escapeHtml(m.text)}${attachTag}</div>
            <div class="msg-time">${timeAgo(m.ts)} ${deliveredTick} ${selfControls}</div>
          </div>
        </div>
      `;
    }

    async function toggleSolved() {
      await setThreadSolved(selectedThread.id, !selectedThread.solved);
      loadList();
    }

    async function deleteThread() {
      if (!confirm("Delete this tracking record? Telegram and the Sheet are untouched — this only removes it from the dashboard.")) return;
      const deletedId = selectedThread.id;
      const res = await authFetch(`/api/threads/${deletedId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "delete" }),
      });
      const data = await res.json();
      if (!data.ok) {
        if (window.showToast) window.showToast(data.error || "Delete failed.", "err");
        return;
      }
      selectedId = null;
      selectedThread = null;
      main.innerHTML = `<div class="threads-placeholder">Pick a thread on the left, or submit a form to start one.</div>`;
      removeLocalThread(deletedId);
      loadList();
      if (window.showToast) window.showToast("Delete success.", "ok");
    }

    // True while a sendReply() call is actually in flight. The Send
    // button's own `disabled` attribute only blocks a second *click* on
    // that button — it does nothing for the separate Enter-key listener
    // below, which calls sendReply() directly with no check at all. A
    // little bit of OS/keyboard key-repeat on Enter (easy to trigger
    // right after picking a mention candidate and pressing Enter to send)
    // fires several keydown events in quick succession, each starting its
    // own concurrent sendReply() call — each one a real, separate POST to
    // Telegram. This flag is the actual re-entrancy guard; the button
    // disable below is now just its (still useful) visual side effect.
    let sendingReply = false;

    async function sendReply() {
      const input = document.getElementById("replyInput");
      const text = input.value.trim();
      if (!text && !pendingAttachments.length) return;
      if (sendingReply) return; // a send is already in flight — ignore this call entirely
      sendingReply = true;
      const btn = document.getElementById("replySend");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const payload = { action: "reply", text };
        if (replyTarget) payload.replyToMessageId = replyTarget.messageId;
        if (pendingAttachments.length) {
          payload.attachments = await Promise.all(pendingAttachments.map(async (f) => ({
            name: f.name,
            type: f.type,
            dataUrl: await fileToDataUrl(f),
          })));
        }
        const res = await authFetch(`/api/threads/${selectedThread.id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!data.ok) {
          alert("❌ Send failed: " + (data.error || "unknown error") + "\n\nYour message wasn't sent — try again.");
          return; // keep input + attachment so the agent can retry without retyping
        }
        selectedThread = data.thread;
        input.value = "";
        pendingAttachments = [];
        renderAttachPreview();
        replyTarget = null;
        renderReplyTargetBanner();
        document.getElementById("replyFileInput").value = "";
        updateThreadContent(selectedThread, true);
        patchLocalThread(selectedThread);
        loadList();
      } catch {
        alert("❌ Send failed: network error.\n\nYour message wasn't sent — try again.");
      } finally {
        sendingReply = false;
        btn.disabled = false;
        btn.textContent = "Send";
      }
    }

    async function editRoot() {
      const newText = prompt("Edit the original Telegram message text:\n(This edits the exact message, including any formatting tags.)", selectedThread.rootText || "");
      if (newText === null) return; // cancelled
      if (!newText.trim()) { if (window.showToast) window.showToast("Text can't be empty.", "err"); return; }
      const res = await postAction({ action: "editRoot", text: newText });
      if (!res.ok) { if (window.showToast) window.showToast(res.error || "Edit failed.", "err"); return; }
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      if (window.showToast) window.showToast("Edit success.", "ok");
    }

    // "🔄 Sync to Sheet" flow — a real per-field form (built straight off
    // window.MODULES, same source of truth the submission form itself
    // uses) instead of editRoot's single free-text prompt(). Saving posts
    // { action: "editDetails", fields, fieldMap } to the same endpoint,
    // which rebuilds the Telegram message AND (if this ticket wrote a
    // trackable Sheet row — see submit.js's `sheetRef`) that Sheet row,
    // using the exact same builder functions the original submission
    // used. Only offered at all when the thread has t.fieldMap/t.brandId
    // saved — see the showIf on the 📊 button in buildHeaderHTML.
    function openEditDetailsModal() {
      const t = selectedThread;
      const module = (window.MODULES || []).find((m) => m.id === t.module);
      if (!module) { if (window.showToast) window.showToast(`Unknown module "${t.module}" — can't build an edit form for this ticket.`, "err"); return; }
      const fieldMap = t.fieldMap || {};

      const overlay = document.createElement("div");
      overlay.className = "edit-details-overlay";
      overlay.innerHTML = `
        <div class="edit-details-modal">
          <button type="button" class="modal-close-btn" id="editDetailsClose" title="Close" aria-label="Close">✕</button>
          <div class="edit-details-title">${module.icon || "📊"} Edit fields — ${escapeHtml(module.name)}</div>
          <div class="edit-details-sub">Updates the Telegram message${t.sheetRef ? " and the Google Sheet row" : ""} from these values — not a guess at parsed text.</div>
          <div class="edit-details-fields" id="editDetailsFields"></div>
          <div class="edit-details-status" id="editDetailsStatus"></div>
          <div class="edit-details-actions">
            <button type="button" class="icon-btn" id="editDetailsCancel" style="width:auto; padding:0 16px;">Cancel</button>
            <button type="button" class="btn-submit" id="editDetailsSave" style="width:auto; padding:10px 22px;">Save &amp; Sync</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      const container = overlay.querySelector("#editDetailsFields");
      // IMPORTANT: keyed by ARRAY INDEX, not by f.key. Some modules (e.g.
      // risk_issue) reuse the same key ("remark") on two different field
      // definitions gated by different showIf conditions — a plain
      // by-key dict would let the second definition silently clobber the
      // first one's DOM reference, so refreshVisibility()/Save would end
      // up reading/hiding the WRONG textarea (bug: a Remark typed for one
      // issueType was silently dropped from the save payload because the
      // dict entry pointed at a different, hidden "remark" field).
      const fieldEls = [];
      // Separate first-match-wins lookup by key, only ever used to find a
      // showIf "driver" field's current value (e.g. "issueType") — driver
      // fields are never duplicated, so this stays safe.
      const fieldElsByKey = {};

      module.fields.forEach((f, i) => {
        const wrap = document.createElement("div");
        wrap.className = "field";
        const value = fieldMap[f.key] != null ? fieldMap[f.key] : "";
        let controlHtml;
        if (f.type === "textarea") {
          controlHtml = `<textarea name="${escapeAttr(f.key)}">${escapeHtml(value)}</textarea>`;
        } else if (f.type === "select") {
          const rawOpts = f.optionsByBrand ? (f.optionsByBrand[t.brandId] || []) : (f.options || []);
          const opts = rawOpts.map((o) => (typeof o === "object" ? o.value : o));
          controlHtml = `<select name="${escapeAttr(f.key)}">
            <option value="">— Select —</option>
            ${opts.map((o) => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
          </select>`;
        } else {
          const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
          controlHtml = `<input type="${inputType}" name="${escapeAttr(f.key)}" value="${escapeAttr(value)}" />`;
        }
        wrap.innerHTML = `<label>${escapeHtml(f.label)}${f.required ? ' <span class="required">*</span>' : ""}</label>${controlHtml}`;
        container.appendChild(wrap);
        const entry = { wrap, control: wrap.querySelector("input,select,textarea") };
        fieldEls[i] = entry;
        if (!(f.key in fieldElsByKey)) fieldElsByKey[f.key] = entry;
      });

      // Same AND-of-conditions showIf logic as the submission form
      // (public/assets/app.js) — deliberately re-implemented here rather
      // than shared, since this modal's fieldEls are plain DOM lookups
      // with no brand-select/attachment/reporter concepts to worry about.
      function conditionMet(showIf) {
        const conditions = Array.isArray(showIf) ? showIf : [showIf];
        return conditions.every((c) => {
          if (c.field === "brand") return c.oneOf.includes(t.brandId); // brand isn't editable here — fixed to the ticket's own
          const driver = fieldElsByKey[c.field];
          return driver && c.oneOf.includes(driver.control.value);
        });
      }
      function refreshVisibility() {
        module.fields.forEach((f, i) => {
          if (!f.showIf) return;
          fieldEls[i].wrap.style.display = conditionMet(f.showIf) ? "" : "none";
        });
      }
      module.fields.forEach((f, i) => {
        if (fieldEls[i].control.tagName === "SELECT") {
          fieldEls[i].control.addEventListener("change", refreshVisibility);
        }
      });
      refreshVisibility();

      function close() { overlay.remove(); }
      overlay.querySelector("#editDetailsClose").addEventListener("click", close);
      overlay.querySelector("#editDetailsCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

      overlay.querySelector("#editDetailsSave").addEventListener("click", async () => {
        const fields = module.fields
          .map((f, i) => ({ f, i })) // pair with original index BEFORE filtering —
                                      // filter() resets indices for a chained map()
          .filter(({ f, i }) => !f.showIf || fieldEls[i].wrap.style.display !== "none")
          .map(({ f, i }) => ({ key: f.key, label: f.label, value: (fieldEls[i].control.value || "").trim() }));
        const missingRequired = module.fields.find((f, i) =>
          f.required && (!f.showIf || fieldEls[i].wrap.style.display !== "none") && !fieldEls[i].control.value.trim()
        );
        const statusEl = overlay.querySelector("#editDetailsStatus");
        if (missingRequired) {
          statusEl.textContent = `"${missingRequired.label}" is required.`;
          statusEl.className = "edit-details-status err";
          return;
        }

        const newFieldMap = Object.fromEntries(fields.map((f) => [f.key, f.value]));
        const saveBtn = overlay.querySelector("#editDetailsSave");
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        statusEl.textContent = "";
        statusEl.className = "edit-details-status";

        const res = await postAction({ action: "editDetails", fields, fieldMap: newFieldMap });
        if (!res.ok) {
          statusEl.textContent = res.error || "Save failed.";
          statusEl.className = "edit-details-status err";
          if (window.showToast) window.showToast(res.error || "Save failed.", "err");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save & Sync";
          return;
        }
        selectedThread = res.thread;
        updateThreadContent(selectedThread);
        patchLocalThread(selectedThread);
        loadList();
        if (res.sheetHasRef && !res.sheetSynced) {
          if (window.showToast) window.showToast("Telegram updated, but the Sheet row couldn't be updated: " + (res.sheetError || "unknown error"), "err");
        } else {
          if (window.showToast) window.showToast("Save success.", "ok");
        }
        close();
      });
    }

    async function recallRoot() {
      if (!confirm("Recall the original ticket message from Telegram? This removes it from the group. Your tracking record, the Sheet row, and this conversation stay.")) return;
      const res = await postAction({ action: "recallRoot" });
      if (!res.ok) { if (window.showToast) window.showToast(res.error || "Recall failed.", "err"); return; }
      selectedThread = res.thread;
      updateThreadContent(selectedThread);
      patchLocalThread(selectedThread);
      loadList();
      if (window.showToast) window.showToast("Recall success.", "ok");
    }

    // "↗️ Generate to another Topic" — creates a brand-new ticket in a
    // DIFFERENT module, pre-filled from this one. Two-stage UI: pick the
    // target Topic first (nothing else makes sense to show before that's
    // chosen, since every module has different fields), THEN the fields
    // for that module render below, pre-filled wherever the source
    // ticket happens to have a same-named field (uid/number/email/etc —
    // whatever matches), left blank otherwise. Brand is carried over
    // read-only, never editable here — see functions/api/forward.js's
    // header comment for why. Posts to a completely separate endpoint
    // (/api/forward), not postAction()'s /api/threads/<id> — this
    // creates an unrelated SECOND thread, it doesn't modify this one.
    function openForwardModal() {
      const source = selectedThread;
      const otherModules = (window.MODULES || []).filter((m) => m.id !== source.module);
      if (!otherModules.length) { if (window.showToast) window.showToast("There are no other Topics to forward this to.", "err"); return; }

      const overlay = document.createElement("div");
      overlay.className = "edit-details-overlay";
      overlay.innerHTML = `
        <div class="edit-details-modal">
          <button type="button" class="modal-close-btn" id="fwdClose" title="Close" aria-label="Close">✕</button>
          <div class="edit-details-title">↗️ Generate to another Topic</div>
          <div class="edit-details-sub">Creates a brand-new ticket, pre-filled from this one — sends to Telegram and (if that Topic logs to a Sheet) writes a row, same as submitting normally.</div>

          <div class="edit-details-fields">
            <div class="field">
              <label>Target Topic <span class="required">*</span></label>
              <select id="fwdModule">
                <option value="">— Select a Topic —</option>
                ${otherModules.map((m) => `<option value="${escapeAttr(m.id)}">${m.icon || ""} ${escapeHtml(m.name)}</option>`).join("")}
              </select>
            </div>
            <div class="field"><label>Brand / Platform</label><input type="text" value="${escapeAttr(source.brand || "")}" disabled /></div>
            <div class="field"><label>Reporter</label><input type="text" id="fwdReporter" value="${escapeAttr((getAuth() && getAuth().username) || "")}" autocomplete="off" /></div>
          </div>

          <div id="fwdFieldsWrap" style="display:none;">
            <div class="edit-details-fields" id="fwdFields"></div>

            <div class="field">
              <span class="attach-label">Additional Screenshots (optional)</span>
              <div class="dropzone" id="fwdDropzone" tabindex="0">
                <div class="dz-icon">📎</div>
                <p class="dz-main">Click or drag files here</p>
                <p class="dz-sub">JPG, PNG, PDF — Max 3 files, 20MB each</p>
                <p class="dz-paste">📋 Ctrl+V / ⌘V to paste screenshot</p>
              </div>
              <div class="file-list" id="fwdFileList"></div>
              <input type="file" id="fwdNewFile" multiple hidden />
            </div>
          </div>

          <div class="edit-details-status" id="fwdStatus"></div>
          <div class="edit-details-actions">
            <button type="button" class="icon-btn" id="fwdCancel" style="width:auto; height:auto; padding:14px 22px; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center;">Cancel</button>
            <button type="button" class="btn-submit" id="fwdSend" style="width:auto; padding:10px 22px;">Generate &amp; Send</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      function close() {
        window.removeEventListener("paste", onPaste); // see the dropzone section below for why this matters
        overlay.remove();
      }
      overlay.querySelector("#fwdClose").addEventListener("click", close);
      overlay.querySelector("#fwdCancel").addEventListener("click", close);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

      // ---- Dynamic fields for whichever Topic gets picked ----
      const fieldsWrap = overlay.querySelector("#fwdFieldsWrap");
      const fieldsContainer = overlay.querySelector("#fwdFields");
      let targetModule = null;
      let fieldEls = {};

      function conditionMet(showIf) {
        const conditions = Array.isArray(showIf) ? showIf : [showIf];
        return conditions.every((c) => {
          if (c.field === "brand") return c.oneOf.includes(source.brandId); // brand is fixed to the source ticket's own, never editable here
          const driver = fieldEls[c.field];
          return driver && c.oneOf.includes(driver.control.value);
        });
      }
      function refreshVisibility() {
        targetModule.fields.forEach((f) => {
          if (!f.showIf) return;
          fieldEls[f.key].wrap.style.display = conditionMet(f.showIf) ? "" : "none";
        });
      }

      overlay.querySelector("#fwdModule").addEventListener("change", (e) => {
        const moduleId = e.target.value;
        targetModule = otherModules.find((m) => m.id === moduleId) || null;
        fieldsContainer.innerHTML = "";
        fieldEls = {};
        if (!targetModule) {
          fieldsWrap.style.display = "none";
          return;
        }
        fieldsWrap.style.display = "";

        targetModule.fields.forEach((f) => {
          const wrap = document.createElement("div");
          wrap.className = "field";
          // Pre-fill from the SOURCE ticket wherever the same field key
          // exists there too (uid/number/email/username/etc, whatever
          // this target module happens to share with the source one) —
          // still fully editable, this is a starting point, not a lock.
          const value = source.fieldMap && source.fieldMap[f.key] != null ? source.fieldMap[f.key] : "";
          let controlHtml;
          if (f.type === "textarea") {
            controlHtml = `<textarea name="${escapeAttr(f.key)}">${escapeHtml(value)}</textarea>`;
          } else if (f.type === "select") {
            const rawOpts = f.optionsByBrand ? (f.optionsByBrand[source.brandId] || []) : (f.options || []);
            const opts = rawOpts.map((o) => (typeof o === "object" ? o.value : o));
            controlHtml = `<select name="${escapeAttr(f.key)}">
              <option value="">— Select —</option>
              ${opts.map((o) => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
            </select>`;
          } else {
            const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
            controlHtml = `<input type="${inputType}" name="${escapeAttr(f.key)}" value="${escapeAttr(value)}" />`;
          }
          wrap.innerHTML = `<label>${escapeHtml(f.label)}${f.required ? ' <span class="required">*</span>' : ""}</label>${controlHtml}`;
          fieldsContainer.appendChild(wrap);
          fieldEls[f.key] = { wrap, control: wrap.querySelector("input,select,textarea") };
        });

        targetModule.fields.forEach((f) => {
          if (fieldEls[f.key].control.tagName === "SELECT") {
            fieldEls[f.key].control.addEventListener("change", refreshVisibility);
          }
        });
        refreshVisibility();
      });

      // ---- Dropzone for additional attachments — same click/drag/paste
      // behavior as the main submission form (public/assets/app.js),
      // just scoped to this modal's own file list instead of a page-load
      // one. Max 3 / 20MB each, matching that form's own defaults (this
      // modal doesn't know the TARGET module's own attachment limits
      // ahead of time the way app.js does, since those aren't loaded
      // until a Topic is picked — 3/20MB is a reasonable universal cap).
      const dropzone = overlay.querySelector("#fwdDropzone");
      const fileInput = overlay.querySelector("#fwdNewFile");
      const fileListEl = overlay.querySelector("#fwdFileList");
      const maxFiles = 3;
      const maxSizeMB = 20;
      let newFiles = [];

      function renderFileList() {
        fileListEl.innerHTML = newFiles
          .map((f, i) => `<div class="file-chip"><span class="name">${escapeHtml(f.name)}</span><button type="button" data-i="${i}">&times;</button></div>`)
          .join("");
        fileListEl.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            newFiles.splice(Number(btn.dataset.i), 1);
            renderFileList();
          });
        });
      }
      function addFiles(list) {
        const rejected = [];
        for (const f of list) {
          if (newFiles.length >= maxFiles) break;
          if (f.size > maxSizeMB * 1024 * 1024) {
            rejected.push(f.name);
            continue;
          }
          newFiles.push(f);
        }
        renderFileList();
        const statusEl = overlay.querySelector("#fwdStatus");
        if (rejected.length) {
          statusEl.textContent = `Skipped (over ${maxSizeMB}MB): ${rejected.join(", ")}`;
          statusEl.className = "edit-details-status err";
        }
      }
      dropzone.addEventListener("click", () => fileInput.click());
      dropzone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") fileInput.click();
      });
      fileInput.addEventListener("change", () => addFiles(fileInput.files));
      ["dragenter", "dragover"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag-over"); })
      );
      ["dragleave", "drop"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag-over"); })
      );
      dropzone.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
      // Scoped to only fire while THIS modal is open — a page-global
      // paste listener (like app.js's, which lives for the page's whole
      // lifetime because the form IS the page) would otherwise keep
      // intercepting paste anywhere on threads.html forever, including
      // after this modal closes. Removed in close() above.
      function onPaste(e) {
        const items = Array.from(e.clipboardData.items).filter((i) => i.kind === "file");
        if (!items.length) return;
        addFiles(items.map((i) => i.getAsFile()).filter(Boolean));
      }
      window.addEventListener("paste", onPaste);

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      overlay.querySelector("#fwdSend").addEventListener("click", async () => {
        const statusEl = overlay.querySelector("#fwdStatus");
        if (!targetModule) {
          statusEl.textContent = "Pick a target Topic first.";
          statusEl.className = "edit-details-status err";
          return;
        }
        const reporter = overlay.querySelector("#fwdReporter").value.trim();
        if (!reporter) {
          statusEl.textContent = "Reporter can't be empty.";
          statusEl.className = "edit-details-status err";
          return;
        }
        const missingRequired = targetModule.fields.find((f) =>
          f.required && (!f.showIf || fieldEls[f.key].wrap.style.display !== "none") && !fieldEls[f.key].control.value.trim()
        );
        if (missingRequired) {
          statusEl.textContent = `"${missingRequired.label}" is required.`;
          statusEl.className = "edit-details-status err";
          return;
        }

        const fields = targetModule.fields
          .filter((f) => !f.showIf || fieldEls[f.key].wrap.style.display !== "none")
          .map((f) => ({ key: f.key, label: f.label, value: (fieldEls[f.key].control.value || "").trim() }));
        const fieldMap = Object.fromEntries(fields.map((f) => [f.key, f.value]));

        const sendBtn = overlay.querySelector("#fwdSend");
        sendBtn.disabled = true;
        sendBtn.textContent = "Generating…";
        statusEl.textContent = "";
        statusEl.className = "edit-details-status";

        const newAttachments = await Promise.all(
          newFiles.map(async (f) => ({ name: f.name, type: f.type, dataUrl: await fileToDataUrl(f) }))
        );

        const res = await authFetch("/api/forward", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sourceThreadId: source.id, targetModule: targetModule.id, fields, fieldMap, reporter, newAttachments }),
        }).then((r) => r.json());

        if (!res.ok) {
          statusEl.textContent = res.error || "Forwarding failed.";
          statusEl.className = "edit-details-status err";
          if (window.showToast) window.showToast(res.error || "Forward failed.", "err");
          sendBtn.disabled = false;
          sendBtn.textContent = "Generate & Send";
          return;
        }

        // Reflect the new backlink on THIS (source) ticket locally,
        // without a full reload — matches the shape addForwardedToLink()
        // actually saved server-side.
        selectedThread.forwardedTo = [
          ...(selectedThread.forwardedTo || []),
          { threadId: res.thread.id, module: targetModule.id, moduleName: targetModule.name, title: res.thread.title, at: new Date().toISOString() },
        ];
        patchLocalThread(selectedThread);
        loadList();
        if (res.sheetAttempted && !res.sheetLogged) {
          if (window.showToast) window.showToast("Sent to Telegram, but the Sheet write failed: " + (res.sheetError || "unknown error"), "err");
        } else {
          if (window.showToast) window.showToast("Forward success.", "ok");
        }
        window.removeEventListener("paste", onPaste);
        openThread(res.thread.id); // jump straight to the newly-created ticket
      });
    }

    async function editReply(messageId, currentText) {
      const newText = prompt("Edit this reply:", currentText || "");
      if (newText === null) return;
      if (!newText.trim()) { if (window.showToast) window.showToast("Text can't be empty.", "err"); return; }
