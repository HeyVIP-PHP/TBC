<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Announcements</title>
<link rel="stylesheet" href="/assets/style.css" />
<script src="/assets/theme.js"></script>
<script src="/assets/starfield.js" defer></script>
<script src="/assets/authguard.js"></script>
<script src="/assets/toast.js"></script>
</head>
<body class="announcements-page">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">PHP CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div id="announcementBanner"></div>
  <script src="/assets/announcement-banner.js" defer></script>

  <div class="threads-topline">
    <a href="/" class="back-pill">&larr; Back to Home</a>
  </div>

  <div class="threads-shell">
    <aside class="threads-sidebar">
      <button type="button" class="ann-new-btn" id="annNewBtn" style="display:none;">+ New announcement</button>
      <div class="threads-search">
        <span>🔍</span>
        <input type="text" id="annSearch" placeholder="Search topic or message…" autocomplete="off" />
      </div>
      <div class="threads-section" id="annSection">
        <div class="threads-section-title"><span>Announcements</span><span class="count" id="annCount">0</span></div>
        <div class="thread-list" id="annList"></div>
      </div>
    </aside>

    <main class="ann-main" data-transition-root>
      <div class="form-card ann-form-card page-morph-in" id="annFormCard">
        <div class="ann-form-scroll" id="annFormScroll">
          <div class="form-header"><span class="icon">📢</span><span id="annFormTitle">New announcement</span></div>

          <div class="field">
            <label>Topic <span class="required">*</span></label>
            <select id="annTopic"></select>
          </div>

          <div class="field">
            <label>Message <span class="required">*</span></label>
            <textarea id="annText" class="ann-message-textarea" placeholder="Message shown in the banner" autocomplete="off"></textarea>
          </div>

          <div class="ann-field-row">
            <div class="field">
              <label>Start (optional)</label>
              <input type="datetime-local" id="annStartAt" autocomplete="off" />
            </div>
            <div class="field">
              <label>End (optional)</label>
              <input type="datetime-local" id="annEndAt" autocomplete="off" />
            </div>
          </div>

          <p class="edit-modal-note" id="annNote"></p>
        </div>
        <div class="ann-form-footer">
          <div class="ann-meta" id="annMeta"></div>
          <button type="button" class="btn-danger" id="annDelete" style="display:none;">Delete</button>
          <button type="button" class="ann-toggle-save" id="annSave"></button>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/page-transition.js"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");
    const authFetch = window.AgentAuth.authFetch;

    const ROLE_RANK = { agent: 0, senior: 1, admin: 2, superadmin: 3, owner: 4 };
    const authInfo = window.AgentAuth.getAuth();

    // Mirrors canSeeAdminSection()/canEditAdminSection() in
    // functions/_shared/accounts.js exactly — UI convenience only, the
    // server independently re-checks on every request regardless of
    // what the client sends.
    function canSee() {
      if (!authInfo) return false;
      if (authInfo.role === "owner") return true;
      if (authInfo.allowedAdminSections === "all") return true;
      return Array.isArray(authInfo.allowedAdminSections) && authInfo.allowedAdminSections.includes("announcements");
    }
    function canEdit() {
      if (!authInfo) return false;
      if (authInfo.role === "owner") return true;
      if (!canSee()) return false;
      if (authInfo.adminSectionEditAccess === "all") return true;
      return Array.isArray(authInfo.adminSectionEditAccess) && authInfo.adminSectionEditAccess.includes("announcements");
    }

    if (!canSee()) {
      document.querySelector(".threads-shell").innerHTML =
        '<div class="threads-placeholder" style="margin:40px auto;">You don\'t have access to Announcements.</div>';
    } else {
      boot();
    }

    let announcements = [];
    let topics = [];
    let selectedId = null; // null = "new announcement" form
    let listPollTimer = null;
    // The Active checkbox was merged into the Save button itself — this
    // tracks the value that will actually be saved. Defaults to whatever
    // the loaded announcement's `enabled` is (or true for a brand-new
    // one); clicking the button flips this AND immediately saves.
    let pendingEnabled = true;
    let annSearchQuery = "";

    function esc(str) {
      return String(str == null ? "" : str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Button shows the CURRENT pending state — green "Active" / muted
    // "Inactive" — so clicking it (see the annSave handler below) flips
    // to the opposite and saves: e.g. if it currently reads "Active",
    // clicking saves the announcement as Inactive.
    function renderToggleSaveButton() {
      const btn = document.getElementById("annSave");
      btn.textContent = pendingEnabled ? "Active" : "Inactive";
      btn.classList.toggle("is-active", pendingEnabled);
      btn.classList.toggle("is-inactive", !pendingEnabled);
    }

    // Same isEffectivelyActive() logic as _shared/announcements.js —
    // client-side mirror for immediate sidebar feedback; the server is
    // still the source of truth for what actually shows in the banner.
    function computeStatus(a) {
      const now = Date.now();
      if (!a.enabled) return "inactive";
      if (a.startAt && now < new Date(a.startAt).getTime()) return "scheduled";
      if (a.endAt && now > new Date(a.endAt).getTime()) return "expired";
      return "active";
    }
    const STATUS_LABEL = { active: "Active", inactive: "Inactive", scheduled: "Scheduled", expired: "Expired" };

    async function boot() {
      const editable = canEdit();
      document.getElementById("annDelete").style.display = editable ? "" : "none";
      document.getElementById("annSave").style.display = editable ? "" : "none";
      document.getElementById("annNewBtn").style.display = editable ? "" : "none";
      [...document.querySelectorAll("#annTopic, #annText, #annStartAt, #annEndAt")].forEach((el) => {
        el.disabled = !editable;
      });

      document.getElementById("annNewBtn").addEventListener("click", () => openForm(null));
      document.getElementById("annSearch").addEventListener("input", (e) => {
        annSearchQuery = e.target.value.trim().toLowerCase();
        renderList();
      });

      await loadAnnouncements();
      listPollTimer = setInterval(pollAnnouncements, 30000);
    }

    // Full re-render (sidebar + form) — only called on initial load, or
    // right after our own Save/Delete, i.e. only when there's genuinely
    // nothing unsaved to lose.
    async function loadAnnouncements() {
      const res = await authFetch("/api/admin/announcements");
      const data = await res.json();
      if (!data.ok) {
        document.getElementById("annList").innerHTML = `<p class="edit-modal-note err">${esc(data.error || "Failed to load.")}</p>`;
        return;
      }
      announcements = data.announcements || [];
      topics = data.topics || [];
      renderList();

      // Defaults to a blank "New announcement" form for accounts that can
      // create one; view-only accounts land on the first existing
      // announcement instead, since they have nothing to create.
      if (canEdit()) {
        openForm(null);
      } else if (announcements.length) {
        openForm(announcements[0].id);
      } else {
        openForm(null);
      }
    }

    // The 30-second background poll never touches the form — only
    // re-renders the sidebar list, so a poll landing while someone is
    // mid-typing a new/edited announcement can't wipe their draft.
    async function pollAnnouncements() {
      const res = await authFetch("/api/admin/announcements");
      const data = await res.json();
      if (!data.ok) return;
      announcements = data.announcements || [];
      topics = data.topics || [];
      renderList();
    }

    function renderList() {
      const list = document.getElementById("annList");
      document.getElementById("annCount").textContent = announcements.length;
      if (!announcements.length) {
        list.innerHTML = '<div class="threads-empty">No announcements yet.</div>';
        return;
      }
      const q = annSearchQuery;
      const filtered = !q
        ? announcements
        : announcements.filter((a) => (a.topic || "").toLowerCase().includes(q) || (a.text || "").toLowerCase().includes(q));
      if (!filtered.length) {
        list.innerHTML = '<div class="threads-empty">No matches.</div>';
        return;
      }
      list.innerHTML = filtered.map((a) => {
        const status = computeStatus(a);
        const selected = a.id === selectedId ? " selected" : "";
        const when = a.updatedAt ? new Date(a.updatedAt).toLocaleString() : "";
        return `
          <div class="thread-item ann-list-item${selected}" data-id="${esc(a.id)}">
            <div class="meta">
              <div class="t-title ann-item-topic">${esc(a.topic || "REMINDER")}</div>
              <div class="ann-item-status"><span class="ann-status-dot ${status}"></span>${STATUS_LABEL[status]}</div>
              <div class="t-sub">${esc(a.updatedBy || a.createdBy || "")}${when ? " · " + esc(when) : ""}</div>
            </div>
          </div>`;
      }).join("");
      list.querySelectorAll(".thread-item").forEach((el) => {
        el.addEventListener("click", () => openForm(el.dataset.id));
      });
    }

    function toDatetimeLocal(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function fromDatetimeLocal(val) {
      if (!val) return null;
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : d.toISOString();
    }

    function openForm(id) {
      selectedId = id || null;
      renderList(); // re-highlight selected row

      const topicSelect = document.getElementById("annTopic");
      topicSelect.innerHTML = topics.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("");

      const note = document.getElementById("annNote");
      note.className = "edit-modal-note";

      const a = selectedId ? announcements.find((x) => x.id === selectedId) : null;

      document.getElementById("annFormTitle").textContent = a ? "Edit announcement" : "New announcement";
      document.getElementById("annDelete").style.display = (a && canEdit()) ? "" : "none";

      topicSelect.value = a ? (a.topic || topics[0]) : topics[0];
      document.getElementById("annText").value = a ? a.text : "";
      pendingEnabled = a ? !!a.enabled : true;
      renderToggleSaveButton();
      document.getElementById("annStartAt").value = a ? toDatetimeLocal(a.startAt) : "";
      document.getElementById("annEndAt").value = a ? toDatetimeLocal(a.endAt) : "";

      // Created/updated info — shown in the footer, left of the buttons.
      // Empty for a brand-new (not-yet-saved) announcement.
      const meta = document.getElementById("annMeta");
      meta.innerHTML = a
        ? `<div>Created by ${esc(a.createdBy || "—")} · ${a.createdAt ? esc(new Date(a.createdAt).toLocaleString()) : "—"}</div>`
          + `<div>Last updated by ${esc(a.updatedBy || "—")} · ${a.updatedAt ? esc(new Date(a.updatedAt).toLocaleString()) : "—"}</div>`
        : "";

      note.textContent = "";

      document.getElementById("annFormScroll").scrollTop = 0;
    }

    document.getElementById("annSave").addEventListener("click", async () => {
      if (!canEdit()) return;
      const note = document.getElementById("annNote");
      const saveBtn = document.getElementById("annSave");
      const text = document.getElementById("annText").value.trim();
      if (!text) {
        note.textContent = "Message is required.";
        note.className = "edit-modal-note err";
        return;
      }
      const startAt = fromDatetimeLocal(document.getElementById("annStartAt").value);
      const endAt = fromDatetimeLocal(document.getElementById("annEndAt").value);
      if (startAt && endAt && new Date(endAt).getTime() <= new Date(startAt).getTime()) {
        note.textContent = "End time must be after start time.";
        note.className = "edit-modal-note err";
        return;
      }

      // The button doubles as the Active/Inactive toggle — clicking it
      // flips the pending state (so a button reading "Active" saves it
      // as Inactive, and vice versa), then saves everything else
      // currently in the form alongside that new state.
      pendingEnabled = !pendingEnabled;
      renderToggleSaveButton();
      const enabledToSave = pendingEnabled;

      saveBtn.disabled = true;
      note.textContent = "Saving…";
      note.className = "edit-modal-note";
      try {
        const res = await authFetch("/api/admin/announcements", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "save",
            id: selectedId || undefined,
            topic: document.getElementById("annTopic").value,
            text,
            enabled: enabledToSave,
            startAt,
            endAt,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Save failed.");
        selectedId = data.announcement.id;
        await loadAnnouncements();
        openForm(selectedId);
        note.textContent = "Saved.";
        note.className = "edit-modal-note ok";
        if (window.showToast) window.showToast("Saved.", "ok");
        // Same device updates instantly instead of waiting up to 60s for
        // the banner's next poll — other devices/agents still only catch
        // up on their own next poll.
        if (window.refreshAnnouncementBanner) window.refreshAnnouncementBanner();
      } catch (err) {
        pendingEnabled = !pendingEnabled; // revert the optimistic flip — nothing was actually saved
        renderToggleSaveButton();
        note.textContent = err.message || "Save failed.";
        note.className = "edit-modal-note err";
        if (window.showToast) window.showToast(err.message || "Save failed.", "err");
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById("annDelete").addEventListener("click", async () => {
      if (!canEdit() || !selectedId) return;
      if (!confirm("Delete this announcement? This can't be undone.")) return;
      const note = document.getElementById("annNote");
      const delBtn = document.getElementById("annDelete");
      delBtn.disabled = true;
      note.textContent = "Deleting…";
      note.className = "edit-modal-note";
      try {
        const res = await authFetch("/api/admin/announcements", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", id: selectedId }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Delete failed.");
        selectedId = null;
        await loadAnnouncements();
        if (window.showToast) window.showToast("Deleted.", "ok");
        if (window.refreshAnnouncementBanner) window.refreshAnnouncementBanner();
      } catch (err) {
        note.textContent = err.message || "Delete failed.";
        note.className = "edit-modal-note err";
        if (window.showToast) window.showToast(err.message || "Delete failed.", "err");
      } finally {
        delBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
