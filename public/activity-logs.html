<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity Logs</title>
<link rel="stylesheet" href="/assets/style.css?v=20637544" />
<script src="/assets/theme.js?v=5b27e630"></script>
<script src="/assets/starfield.js?v=b6e92821" defer></script>
<script src="/assets/authguard.js?v=9cc20fef"></script>
<script src="/assets/presence-heartbeat.js?v=219d34cc"></script>
<script src="/assets/toast.js?v=debe1ac1"></script>
</head>
<body class="announcements-page">
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/img/logo.webp" alt="HeyVIP" class="logo-img" />
      <span class="wordmark">PHP CS TEAM - TBC</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="liveClock"></span>
      <button class="theme-pill" id="themeToggle"></button>
      <span class="agent-whoami" id="agentWhoami"></span>
    </div>
  </header>

  <div class="threads-shell">
    <div class="threads-right-col" style="width:100%;">
      <div class="threads-topline">
        <a href="/" class="back-pill">&larr; Back to Home</a>
      </div>
      <main class="ann-main actlog-main" data-transition-root>
        <div id="actlogCard" style="width:100%; max-width:1800px; margin:0 auto;" class="page-morph-in">

          <div class="actlog-header-card">
            <div class="actlog-header-left">
              <div class="actlog-header-icon">🔎</div>
              <div>
                <p class="actlog-header-title">Activity Logs</p>
                <p class="actlog-header-sub">Who edited or deleted what, when, and from where. Kept for 90 days.</p>
              </div>
            </div>
            <button type="button" class="icon-btn icon-btn-labeled" id="actlogRefresh"><span class="icon-spin-target">↻</span> Refresh</button>
          </div>

          <div class="actlog-filter-row">
            <select id="actlogCategory" class="acct-role-filter">
              <option value="">All categories</option>
              <option value="Auth">🔐 Auth</option>
              <option value="Account">👤 Account</option>
              <option value="Thread">🎫 Thread</option>
              <option value="Config">⚙️ Config</option>
            </select>
            <input type="text" id="actlogAgentFilter" class="actlog-agent-filter" placeholder="Filter by agent…" autocomplete="off" />
            <div class="actlog-search-wrap">
              <input type="text" id="actlogSearch" placeholder="Search action, detail, IP…" autocomplete="off" />
            </div>
            <span class="actlog-count" id="actlogCount"></span>
          </div>

          <div class="actlog-results-card">
            <div class="actlog-results-head">
              <div class="actlog-results-title">
                <span class="actlog-dot"></span>
                Recent activity
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <select class="ipa-page-size" id="actlogPageSize" style="display:none;">
                  <option value="10">10 / page</option>
                  <option value="20">20 / page</option>
                  <option value="30">30 / page</option>
                </select>
                <span class="actlog-count-pill" id="actlogCountPill">0 found</span>
              </div>
            </div>
            <div class="actlog-table-wrap">
              <table class="actlog-table" id="actlogTable">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Agent</th>
                    <th>Action</th>
                    <th class="actlog-col-detail">Detail</th>
                    <th>IP</th>
                  </tr>
                </thead>
                <tbody id="actlogTbody"></tbody>
              </table>
            </div>
            <div class="threads-placeholder" id="actlogEmpty" style="display:none;">No activity recorded yet.</div>
            <div class="ipa-pagination" id="actlogPagination" style="display:none; padding:10px 22px 16px;"></div>
          </div>

        </div>
        <div style="height:40px; flex-shrink:0;"></div>
      </main>
    </div>
  </div>

  <script src="/assets/page-transition.js?v=437ace08"></script>
  <script>
    window.initThemeToggle();
    window.initClock();
    window.AgentAuth.renderWhoami("agentWhoami");
    const authFetch = window.AgentAuth.authFetch;
    const authInfo = window.AgentAuth.getAuth();

    // Mirrors canSeeAdminSection() in functions/_shared/accounts.js
    // exactly — UI convenience only, the server (GET /api/admin/
    // activity-logs) independently re-checks on every request regardless
    // of what this client-side check decides to show.
    function canSee() {
      if (!authInfo) return false;
      if (authInfo.role === "owner") return true;
      if (authInfo.allowedAdminSections === "all") return true;
      return Array.isArray(authInfo.allowedAdminSections) && authInfo.allowedAdminSections.includes("activityLogs");
    }

    if (!canSee()) {
      document.getElementById("actlogCard").innerHTML =
        '<div class="threads-placeholder" style="margin:40px auto;">You don\'t have access to Activity Logs.</div>';
    } else {
      boot();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const CATEGORY_ICON = { Auth: "🔐", Account: "👤", Thread: "🎫", Config: "⚙️" };

    // Routine ticket-workflow noise — every reply/create/solve toggle logs
    // an entry, but on a busy day that's the vast majority of the feed and
    // drowns out the entries an Owner actually needs to review here: edits
    // and deletions. Filtered out at load time (not just hidden by a UI
    // filter) so the counts, category dropdown, search, and pagination all
    // reflect the same "edits & deletes" audit view consistently. These
    // actions are still written to KV by logActivity() as normal — this is
    // a display-only exclusion, not a change to what gets recorded.
    const HIDDEN_ACTIONS = new Set(["Ticket Created", "Ticket Solved", "Ticket Reopened", "Ticket Replied"]);

    // Edit/recall/delete actions are the whole point of this page now —
    // give them a distinct accent color on top of the category badge so
    // they're easy to scan at a glance instead of blending in with e.g.
    // Login/Config entries.
    const ACTION_ACCENT = {
      "Ticket Deleted": "danger",
      "Root Recalled": "danger",
      "Reply Recalled": "danger",
      "Root Edited": "edit",
      "Details Edited": "edit",
      "Reply Edited": "edit",
      "Brand Link Edited": "edit",
    };

    let allEntries = [];
    // Same shape as ipaPageState in index.html's IP Access dashboard —
    // single-table version of that per-category state, since this page
    // only ever has one table. Any filter change resets to page 1 (an
    // IPA table doesn't have filters to reset from, only page-size —
    // this is the one thing added on top of that pattern, not a
    // deviation from it).
    let actlogPage = 1;
    let actlogPageSize = 10;

    async function boot() {
      await load();
      document.getElementById("actlogRefresh").addEventListener("click", load);
      document.getElementById("actlogCategory").addEventListener("change", () => { actlogPage = 1; render(); });
      document.getElementById("actlogAgentFilter").addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
      document.getElementById("actlogSearch").addEventListener("input", debounce(() => { actlogPage = 1; render(); }, 150));
      document.getElementById("actlogPageSize").addEventListener("change", (e) => {
        actlogPageSize = Number(e.target.value);
        actlogPage = 1;
        render();
      });
      document.getElementById("actlogPagination").addEventListener("click", (e) => {
        const btn = e.target.closest(".ipa-page-btn");
        if (!btn || btn.disabled) return;
        actlogPage += btn.dataset.dir === "next" ? 1 : -1;
        render();
      });
      // Delegate row clicks to toggle the full detail text (long
      // edit/recall diffs are line-clamped to 3 lines by default, see
      // .actlog-detail in style.css) — no separate modal needed, the
      // full text is already in the cell, just visually collapsed.
      document.getElementById("actlogTbody").addEventListener("click", (e) => {
        const row = e.target.closest("tr[data-detail-row]");
        if (row) row.querySelector(".actlog-detail")?.classList.toggle("is-expanded");
      });
    }

    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    async function load() {
      const btn = document.getElementById("actlogRefresh");
      if (btn.disabled) return; // already loading, ignore a repeat click/keypress
      btn.classList.add("spinning");
      btn.disabled = true;
      const startedAt = Date.now();
      const MIN_VISIBLE_MS = 600; // short list fetch — just enough that a fast response doesn't look like nothing happened
      try {
        const res = await authFetch("/api/admin/activity-logs", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) {
          window.showToast ? window.showToast(data.error || "Failed to load.", "error") : alert(data.error || "Failed to load.");
          return;
        }
        allEntries = (data.entries || []).filter((e) => !HIDDEN_ACTIONS.has(e.action));
        render();
      } catch (e) {
        window.showToast ? window.showToast(String(e.message || e), "error") : alert(String(e.message || e));
      } finally {
        const elapsed = Date.now() - startedAt;
        if (elapsed < MIN_VISIBLE_MS) await new Promise((r) => setTimeout(r, MIN_VISIBLE_MS - elapsed));
        btn.classList.remove("spinning");
        btn.disabled = false;
      }
    }

    function render() {
      const category = document.getElementById("actlogCategory").value;
      const agentFilter = document.getElementById("actlogAgentFilter").value.trim().toLowerCase();
      const q = document.getElementById("actlogSearch").value.trim().toLowerCase();

      const filtered = allEntries.filter((e) => {
        if (category && e.category !== category) return false;
        if (agentFilter && !(e.agent || "").toLowerCase().includes(agentFilter)) return false;
        if (q) {
          const hay = `${e.action} ${e.detail} ${e.ip}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("actlogCount").textContent = `${filtered.length} of ${allEntries.length}`;
      document.getElementById("actlogCountPill").textContent = `${filtered.length} found`;
      document.getElementById("actlogEmpty").style.display = filtered.length ? "none" : "";
      document.getElementById("actlogTable").style.display = filtered.length ? "" : "none";

      const pageSizeSelect = document.getElementById("actlogPageSize");
      pageSizeSelect.style.display = filtered.length ? "" : "none";
      pageSizeSelect.value = String(actlogPageSize);

      const totalPages = Math.max(1, Math.ceil(filtered.length / actlogPageSize));
      if (actlogPage > totalPages) actlogPage = totalPages; // e.g. after a filter shrinks the list
      const start = (actlogPage - 1) * actlogPageSize;
      const pageEntries = filtered.slice(start, start + actlogPageSize);

      const paginationEl = document.getElementById("actlogPagination");
      if (filtered.length > actlogPageSize) {
        paginationEl.style.display = "flex";
        paginationEl.innerHTML = `
          <button type="button" class="ipa-page-btn" data-dir="prev"${actlogPage <= 1 ? " disabled" : ""}>Previous</button>
          <span class="ipa-page-info">Page ${actlogPage} of ${totalPages}</span>
          <button type="button" class="ipa-page-btn" data-dir="next"${actlogPage >= totalPages ? " disabled" : ""}>Next</button>`;
      } else {
        paginationEl.style.display = "none";
        paginationEl.innerHTML = "";
      }

      const tbody = document.getElementById("actlogTbody");
      tbody.innerHTML = pageEntries.map((e) => {
        const d = new Date(e.ts);
        const dateStr = isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "2-digit", day: "2-digit" });
        const timeStr = isNaN(d) ? "—" : d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        const icon = CATEGORY_ICON[e.category] || "";
        const accent = ACTION_ACCENT[e.action];
        const badgeClass = `actlog-badge actlog-badge-${e.category || "Config"}${accent ? ` actlog-badge-accent-${accent}` : ""}`;
        const accentIcon = accent === "danger" ? "🗑️ " : accent === "edit" ? "✏️ " : "";
        return `
        <tr data-detail-row${accent ? ` class="actlog-row-${accent}"` : ""}>
          <td>${esc(dateStr)}</td>
          <td>${esc(timeStr)}</td>
          <td>${esc(e.agent)}</td>
          <td><span class="${badgeClass}" title="${esc(e.category)}">${accentIcon || icon + " "}${esc(e.action)}</span></td>
          <td class="actlog-col-detail"><div class="actlog-detail">${esc(e.detail)}</div></td>
          <td>${esc(e.ip)}</td>
        </tr>`;
      }).join("");
    }
  </script>
</body>
</html>
